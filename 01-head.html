<meta name="theme-color" content="#120f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: setup = two-column control deck over a sticky start bar; stage = HUD band, MPC-style pad board, transport strip.
   One deliberate dark "stage" look (single theme): rubber pads, an amber ball, six lit-pad rhyme colors. */
:root{
  --stage:#120f17;
  --deck:#1a1621;
  --deck-2:#221c2b;
  --rubber:#2b2435;
  --rubber-2:#362d42;
  --lip:#09070c;
  --ink:#f7efe3;
  --ink-2:#c3b8cf;
  --ink-3:#8c809a;
  --line:rgba(247,239,227,.09);
  --amber:#ffb12e;
  --amber-2:#ff8a1f;
  --amber-ink:#2a1606;
  --danger:#ff5f6d;
  --r1:#ff7a3d; --r2:#3fb8f0; --r3:#ffd23a; --r4:#4fdc8f; --r5:#c286ff; --r6:#ff5f8f;
  --pad-ink:#1c1422;
  --f-display:"Bungee","Archivo Black",Impact,"Arial Black",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --grain:none;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background-color:var(--stage); color:var(--ink);
  background-image:var(--grain), radial-gradient(120% 70% at 50% -10%, rgba(255,177,46,.10), transparent 60%);
  background-attachment:fixed;
  font-family:var(--f-body); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.screen[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- shared controls: rubber pads ---------- */
.chip{
  appearance:none; border:0; background:var(--rubber); color:var(--ink-2);
  padding:9px 14px; border-radius:10px; font-weight:650; font-size:14px; line-height:1.2;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  transition:background-color .15s, color .15s, transform .06s;
  display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
}
.chip:hover{background:var(--rubber-2); color:var(--ink)}
.chip:active{transform:translateY(1px); box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
.chip[aria-pressed="true"]{
  background:var(--amber); color:var(--amber-ink);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), 0 0 24px -6px rgba(255,177,46,.65);
}
.chip.ghost{background:transparent; box-shadow:inset 0 0 0 1px var(--line)}
.chip.ghost:hover{background:var(--rubber)}
.chip.small{padding:6px 10px; font-size:13px; border-radius:8px}
.chip:disabled{opacity:.45; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.seg{display:inline-flex; background:var(--lip); padding:4px; border-radius:12px; gap:4px}
.seg .chip{box-shadow:none; background:transparent}
.seg .chip[aria-pressed="true"]{background:var(--amber); color:var(--amber-ink)}
.icon-btn{appearance:none; border:0; background:var(--rubber); width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:var(--ink-2); box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.icon-btn:hover{background:var(--rubber-2); color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.label{font:500 11px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin:0}
.hint{color:var(--ink-3); font-size:13px; margin:0}
.toggle{display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none; color:var(--ink-2); font-size:14px}
.toggle input{appearance:none; width:40px; height:24px; border-radius:20px; background:var(--rubber-2); position:relative; margin:0; cursor:pointer; transition:background-color .15s; flex:none}
.toggle input::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--ink-2); transition:transform .15s, background-color .15s}
.toggle input:checked{background:var(--amber)}
.toggle input:checked::after{transform:translateX(16px); background:var(--amber-ink)}
input[type="text"],input[type="number"],input[type="search"],input[type="url"]{
  background:var(--lip); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:0; width:100%;
}
input[type="text"]:focus,input[type="number"]:focus,input[type="search"]:focus,input[type="url"]:focus{outline:none; border-color:var(--amber)}
input[type="range"]{width:100%; accent-color:var(--amber)}

/* ---------- SETUP ---------- */
#setup{min-height:100%; display:flex; flex-direction:column}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-inline:clamp(16px,3vw,44px); padding-block:22px 18px; max-width:1360px; width:100%; margin-inline:auto}
.brand{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 22px; min-width:0}
.wordmark{display:flex; align-items:flex-end; gap:6px; position:relative; padding-top:30px}
.wm-pad{
  font-family:var(--f-display); font-size:clamp(20px,2.4vw,30px); line-height:1; letter-spacing:.02em;
  padding:.4em .48em .34em; border-radius:10px; color:var(--pad-ink);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), 0 3px 0 var(--lip);
}
.wm-pad.a{background:var(--r1)} .wm-pad.b{background:var(--r2)}
.wm-ball{position:absolute; top:0; left:calc(16% - 9px); width:18px; height:18px; animation:wmTravel 2.1s linear infinite}
.wm-ball i{display:block; width:100%; height:100%; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff5d2 0 12%, var(--amber) 48%, var(--amber-2));
  box-shadow:0 0 16px rgba(255,177,46,.75); animation:wmHop .7s infinite}
@keyframes wmTravel{0%{left:calc(16% - 9px)}33.33%{left:calc(50% - 9px)}66.66%{left:calc(84% - 9px)}100%{left:calc(16% - 9px)}}
@keyframes wmHop{0%{transform:translateY(16px);animation-timing-function:cubic-bezier(.33,.66,.66,1)}50%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.33,0,.66,.33)}100%{transform:translateY(16px)}}
.tagline{margin:0 0 4px; color:var(--ink-2); font-size:15px; max-width:42ch}
.tagline b{color:var(--ink); font-weight:700}

/* landing: hero with the matchup and one big start button; every setting lives in a collapsible row below */
.setup-top{display:flex; justify-content:flex-end; padding:18px clamp(16px,3vw,44px) 0; max-width:1100px; width:100%; margin-inline:auto}
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; padding:clamp(4px,3vh,40px) clamp(16px,3vw,44px) clamp(28px,5vh,56px); max-width:1100px; width:100%; margin-inline:auto}
.wordmark.big .wm-pad{font-size:clamp(34px,6.4vw,68px); border-radius:clamp(12px,1.6vw,18px)}
.wordmark.big{gap:clamp(6px,1vw,12px); padding-top:clamp(38px,6vw,64px)}
.wordmark.big .wm-ball{width:clamp(18px,2.4vw,28px); height:clamp(18px,2.4vw,28px)}
.hero .tagline{font-size:clamp(15px,1.5vw,18px); max-width:46ch; margin:0}
.matchup{display:flex; align-items:center; justify-content:center; gap:clamp(12px,2.4vw,28px); flex-wrap:wrap; margin-top:6px; width:100%}
.mu-team{appearance:none; border:0; cursor:pointer; font:inherit; color:var(--ink); background:var(--deck); border-radius:18px; padding:14px 22px 13px; min-width:min(100%,220px); max-width:380px;
  display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:inset 0 3px 0 var(--c), 0 0 0 1px var(--line); transition:transform .12s, box-shadow .12s}
.mu-team:hover{transform:translateY(-2px); box-shadow:inset 0 3px 0 var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent)}
.mu-name{font:400 clamp(24px,3.4vw,38px)/1 var(--f-display); color:var(--c); letter-spacing:.02em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mu-crew{font-size:13px; color:var(--ink-3); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mu-vs{font:400 clamp(16px,1.8vw,20px)/1 var(--f-display); color:var(--ink-3); letter-spacing:.1em}
.mu-solo{font:400 clamp(24px,3.4vw,38px)/1 var(--f-display); color:var(--amber)}
.hero-go{font-size:clamp(20px,2.2vw,26px); padding:20px 40px 18px; margin-top:4px}
@media (max-width:560px){ .matchup{flex-direction:column; gap:8px} .mu-team{width:100%; max-width:none} .hero-go{width:100%; justify-content:center} }
.hero-go svg{width:22px; height:22px}
.hero-sum{margin:0; color:var(--ink-3); font:400 13px/1.5 var(--f-mono); max-width:70ch}
.hero-sum b{color:var(--ink-2); font-weight:500}
.acc{display:flex; flex-direction:column; gap:10px; padding:0 clamp(16px,3vw,44px) 140px; max-width:980px; width:100%; margin-inline:auto}
.acc-label{margin:0 0 2px 4px; font:500 11px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.acc-item{background:var(--deck); border:1px solid var(--line); border-radius:16px; min-width:0}
.acc-item[hidden]{display:none}
.acc-item>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:14px; padding:16px clamp(16px,2vw,22px); border-radius:16px}
.acc-item>summary::-webkit-details-marker{display:none}
.acc-item>summary:hover .acc-chev{color:var(--amber)}
.acc-item>summary:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.acc-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin-right:auto; min-width:0}
.acc-h b{font:400 clamp(16px,1.5vw,19px)/1.1 var(--f-display); letter-spacing:.02em; font-weight:400}
.acc-sum{color:var(--ink-3); font:400 12.5px/1.4 var(--f-mono); min-width:0}
.acc-chev{width:20px; height:20px; flex:none; color:var(--ink-2); transition:transform .2s}
.acc-item[open]>summary .acc-chev{transform:rotate(180deg)}
.acc-body{display:flex; flex-direction:column; gap:16px; padding:2px clamp(16px,2vw,22px) clamp(16px,2vw,22px); min-width:0}
.acc-body .panel-head h2{display:none}
.acc-body .beats{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.acc-body .panel-head:empty,.acc-body .panel-head:not(:has(> :not(h2))){display:none}
.hero-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px}
.tour-btn svg{color:var(--amber)}
.mu-badge{margin:-4px 0 0; display:inline-flex; align-items:center; gap:8px; font:500 12px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--amber)}
.mu-badge[hidden]{display:none}
.mu-badge button{appearance:none; border:0; background:none; color:var(--ink-2); font:inherit; letter-spacing:inherit; text-decoration:underline; cursor:pointer; padding:0}

/* tournament bracket */
#bracket{min-height:100%; display:flex; flex-direction:column}
.br-top{display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; padding:18px clamp(16px,3vw,44px) 8px; max-width:1500px; width:100%; margin-inline:auto}
.br-title{margin:0 auto 0 0; display:flex; align-items:center; gap:10px; font:400 clamp(24px,3vw,36px)/1 var(--f-display); letter-spacing:.02em}
.br-title svg{width:.9em; height:.9em; color:var(--amber)}
.br-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.br-body{display:flex; flex-direction:column; gap:20px; padding:10px clamp(16px,3vw,44px) 48px; max-width:1500px; width:100%; margin-inline:auto}
.br-banner{display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; background:var(--deck); border:1px solid var(--line); border-radius:18px; padding:16px 18px 16px 22px}
.br-banner b{font:400 clamp(22px,3vw,36px)/1.05 var(--f-display); letter-spacing:.02em; margin-right:auto}
.br-banner b i{font-style:normal; color:var(--ink-3); font-size:.6em; padding-inline:.3em}
.br-banner .label{flex-basis:100%}
.br-banner.champ{border-color:color-mix(in srgb, var(--c) 60%, transparent); box-shadow:0 0 60px -20px var(--c)}
.br-banner.champ b{color:var(--c)}
.br-scroll{overflow-x:auto; padding-bottom:8px}
.br-grid{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,1fr); column-gap:44px; min-height:calc(var(--cells) * 132px + 40px); min-width:min-content}
.br-round{display:flex; flex-direction:column; min-width:0}
.br-round h3{margin:0 0 10px; font:500 11px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); text-align:center}
.br-col{flex:1; display:flex; flex-direction:column}
.br-pair{flex:2; display:flex; flex-direction:column; position:relative}
.br-pair::after{content:""; position:absolute; right:-22px; top:25%; bottom:25%; width:22px; border:2px solid var(--line); border-left:0; border-radius:0 12px 12px 0}
.br-cell{flex:1; display:flex; align-items:center; position:relative; padding-block:6px}
.br-round:not(:first-child) .br-cell::before{content:""; position:absolute; left:-22px; top:50%; width:22px; border-top:2px solid var(--line)}
.br-match{width:100%; background:var(--deck); border:1px solid var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:6px}
.br-match.next{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 0 40px -16px var(--amber)}
.br-match.bye{opacity:.6}
.br-mhead{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:26px; padding:0 2px 0 4px; font:500 10.5px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.br-slot{appearance:none; border:0; font:inherit; color:var(--ink); text-align:left; width:100%; display:grid; grid-template-columns:10px minmax(0,1fr) auto; align-items:center; column-gap:9px; row-gap:2px; padding:8px 10px; border-radius:10px; background:var(--deck-2); min-width:0}
button.br-slot{cursor:pointer}
button.br-slot:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent)}
.br-dot{width:10px; height:10px; border-radius:50%; background:var(--c)}
.br-name{font-weight:750; font-stretch:108%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.br-crew{grid-column:2/4; font-size:12px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.br-tick{font:500 10px/1 var(--f-mono); letter-spacing:.12em; color:var(--amber-ink); background:var(--amber); padding:4px 6px 3px; border-radius:6px}
.br-slot.win{background:color-mix(in srgb, var(--c) 22%, var(--deck-2)); box-shadow:inset 3px 0 0 var(--c)}
.br-slot.lose{opacity:.42}
.br-slot.lose .br-name{text-decoration:line-through; text-decoration-thickness:1.5px}
.br-slot.empty{display:block; color:var(--ink-3); font-size:13px; font-style:italic; padding:10px 12px}
.br-champ{width:100%; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:18px 12px; border-radius:16px; border:1.5px dashed var(--line); color:var(--ink-3)}
.br-champ svg{width:30px; height:30px; color:var(--c)}
.br-champ .br-name{font:400 clamp(20px,2vw,26px)/1.05 var(--f-display); white-space:normal}
.br-champ .br-crew{grid-column:auto; white-space:normal}
.br-champ.won{border:1.5px solid var(--c); background:color-mix(in srgb, var(--c) 14%, var(--deck)); color:var(--ink); box-shadow:0 0 50px -18px var(--c)}
.br-champ.won .br-name{color:var(--c)}
.br-help{margin:0}
.br-form{display:flex; flex-direction:column; gap:16px; max-width:900px; width:100%; margin-inline:auto; background:var(--deck); border:1px solid var(--line); border-radius:18px; padding:clamp(16px,2.4vw,26px)}
.br-form-head h2{margin:0 0 6px; font:400 clamp(20px,2vw,24px)/1.1 var(--f-display)}
.br-teams{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.br-teams li{display:grid; grid-template-columns:30px minmax(0,1fr) minmax(0,1.6fr) auto; gap:8px; align-items:center}
.br-seed{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font:500 12px/1 var(--f-mono); color:var(--pad-ink); background:var(--c)}
.br-move{display:flex; gap:2px}
.br-form-tools{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.br-form-tools .hint{margin-left:auto}
.br-form-go{display:flex; justify-content:flex-end}
@media (max-width:640px){ .br-teams li{grid-template-columns:30px minmax(0,1fr) auto; } .br-teams li input[data-bind="bt-crew"]{grid-column:2/4} }
.end-winner{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%}
.end-winner[hidden]{display:none}
.end-winner .ew-btns{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.ew-team{appearance:none; border:0; cursor:pointer; font:400 clamp(20px,2.4vw,28px)/1 var(--f-display); letter-spacing:.02em; color:var(--pad-ink); background:var(--c); padding:16px 26px 14px; border-radius:14px; box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.ew-team:hover{filter:brightness(1.08)}

/* the bottom start bar only appears once the big start button has scrolled away */
.startbar{transform:translateY(130%); transition:transform .25s ease}
.startbar.show{transform:none}
.deck{flex:1; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; padding-inline:clamp(16px,3vw,44px); padding-block:4px 140px; max-width:1360px; width:100%; margin-inline:auto}
@media (min-width:1020px){.deck{grid-template-columns:minmax(0,5fr) minmax(0,7fr); align-items:start}}
.col{display:flex; flex-direction:column; gap:18px; min-width:0}
.panel{background:var(--deck); border:1px solid var(--line); border-radius:18px; padding:clamp(16px,2vw,24px); display:flex; flex-direction:column; gap:16px; min-width:0}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.panel h2{font:400 clamp(17px,1.6vw,20px)/1.1 var(--f-display); letter-spacing:.02em; margin:0; color:var(--ink)}
.field{display:flex; flex-direction:column; gap:9px; min-width:0}
.blurb{color:var(--ink-2); font-size:14px; margin:0}

/* teams + lineup */
.teams{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center}
.team-in{display:flex; align-items:center; gap:8px; background:var(--lip); border:1px solid var(--line); border-radius:12px; padding:5px 6px 5px 5px; min-width:0}
.team-in:focus-within{border-color:var(--amber)}
.team-in input{border:0; background:transparent; padding:6px 4px; font-weight:750; font-stretch:110%}
.team-in input:focus{border:0}
.swatch{appearance:none; border:0; width:30px; height:30px; border-radius:8px; background:var(--c); flex:none; box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.vs{font:400 14px/1 var(--f-display); color:var(--ink-3)}
.lineup{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.mc{display:grid; grid-template-columns:22px minmax(0,1fr) auto auto; gap:8px; align-items:center}
.mc .n{font:500 12px/1 var(--f-mono); color:var(--ink-3); text-align:right}
.mc input{padding:8px 10px}
.team-tag{appearance:none; border:0; border-radius:9px; padding:8px 10px; font-weight:750; font-size:13px; background:color-mix(in srgb, var(--c) 22%, var(--rubber)); color:var(--c); max-width:9.5em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.x-btn{appearance:none; border:0; background:transparent; width:32px; height:32px; border-radius:8px; color:var(--ink-3); display:grid; place-items:center}
.x-btn:hover{background:var(--rubber); color:var(--ink)}
.x-btn svg{width:16px;height:16px}
.order{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none; counter-reset:o}
.order li{counter-increment:o; display:inline-flex; align-items:center; gap:7px; padding:6px 10px 6px 8px; border-radius:9px; background:var(--deck-2); font-size:13px; color:var(--ink-2)}
.order li::before{content:counter(o); font:500 11px/1 var(--f-mono); color:var(--ink-3)}
.order li i{width:9px; height:9px; border-radius:50%; background:var(--c); flex:none}
.order li.round{background:transparent; padding-inline:4px; color:var(--ink-3); font:500 11px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase}
.order li.round::before{content:none}
.order li.round{counter-increment:none}
.names-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:10px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); gap:16px}

/* team rosters */
.rosters-wrap{container-type:inline-size}
.rosters{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:start}
.rosters .vs{align-self:center; padding-top:4px}
@container (max-width:460px){ .rosters{grid-template-columns:minmax(0,1fr)} .rosters .vs{justify-self:center; padding:0} }
.roster{display:flex; flex-direction:column; gap:8px; background:var(--deck-2); border-radius:14px; padding:10px; border-top:3px solid var(--c); min-width:0}
.roster .team-in{background:var(--lip)}
.crew{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.crew li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px; align-items:center; position:relative}
.crew li::before{content:""; position:absolute; left:10px; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%; background:var(--c); pointer-events:none}
.crew input{padding:8px 10px 8px 26px}
.roster .add-mc{align-self:flex-start}
.chip[data-act="first"][aria-pressed="true"]{background:var(--c); color:var(--pad-ink)}

/* scheme preview */
.preview{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; background:var(--lip); border-radius:14px; padding:clamp(12px,1.6vw,18px)}
.mini{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px}
.mini .p{height:clamp(34px,4.2vw,44px); border-radius:9px; background:var(--rubber); display:grid; place-items:center; padding-inline:4px;
  font-weight:800; font-stretch:112%; font-size:clamp(12px,1.25vw,15px); color:var(--pad-ink); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.c1{--pc:var(--r1)} .c2{--pc:var(--r2)} .c3{--pc:var(--r3)} .c4{--pc:var(--r4)} .c5{--pc:var(--r5)} .c6{--pc:var(--r6)}
.mini .p.rh{background:var(--pc)}
.mini .p.blank{background:color-mix(in srgb, var(--pc) 30%, var(--rubber)); box-shadow:inset 0 0 0 2px var(--pc), inset 0 -3px 0 rgba(0,0,0,.25)}
.scheme-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px}

/* word browser */
.wordbank{border-top:1px solid var(--line); margin-top:2px}
.wordbank summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 2px 2px; border-radius:8px}
.wb-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-right:auto; min-width:0}
.wordbank summary::-webkit-details-marker{display:none}
.wb-title{font-weight:750; font-stretch:108%; font-size:15px}
.wb-meta{font:400 12px/1.3 var(--f-mono); color:var(--ink-3)}
.wb-chev{width:20px; height:20px; flex:none; color:var(--ink-2); transition:transform .2s}
.wordbank summary:hover .wb-chev{color:var(--amber)}
.wordbank[open] .wb-chev{transform:rotate(180deg)}
.wb-body{display:flex; flex-direction:column; gap:12px; padding-top:14px}
.wb-tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.wb-tools input{flex:1 1 180px; max-width:280px}
.chip .ct{font:500 11px/1 var(--f-mono); opacity:.65; font-variant-numeric:tabular-nums}
#wbSum{color:var(--ink-2)}
#wbSum b{color:var(--ink)}
.wb-fams{max-height:min(60vh,520px); overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:2px; background:var(--lip); border-radius:14px; padding:8px}
.fam{display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; align-items:start; padding:6px; border-radius:10px}
.fam:nth-child(even){background:rgba(247,239,227,.025)}
.fam-n{font:500 11px/25px var(--f-mono); color:var(--ink-3); text-align:right; font-variant-numeric:tabular-nums}
.fam-w{display:flex; flex-wrap:wrap; gap:5px; min-width:0}
.w{font-weight:750; font-stretch:110%; font-size:13px; line-height:1; padding:6px 8px 5px; border-radius:7px; background:var(--pc); color:var(--pad-ink); box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); white-space:nowrap}
.w.anchor{background:var(--ink); color:var(--pad-ink); box-shadow:inset 0 0 0 2px var(--pc), inset 0 -2px 0 rgba(0,0,0,.18)}
.w.anchor.hit{box-shadow:inset 0 0 0 2px var(--pc), 0 0 0 2px var(--amber)}
.w.hit{box-shadow:0 0 0 2px var(--ink), inset 0 -2px 0 rgba(0,0,0,.22)}
.fam.off{opacity:.38}
.fam-note{font:500 11px/25px var(--f-mono); color:var(--ink-3); letter-spacing:.06em}
.pack-tgl{appearance:none; width:22px; height:22px; margin-top:2px; border-radius:6px; border:1.5px solid var(--ink-3); background:transparent; display:grid; place-items:center; padding:0}
.pack-tgl:hover{border-color:var(--amber)}
.pack-tgl[aria-pressed="true"]{background:var(--amber); border-color:var(--amber)}
.pack-tgl[aria-pressed="true"]::after{content:""; width:10px; height:5px; border-left:2.5px solid var(--amber-ink); border-bottom:2.5px solid var(--amber-ink); transform:translateY(-1px) rotate(-45deg)}
button.w{appearance:none; border:0; font-family:inherit; cursor:pointer; transition:filter .12s, transform .06s}
button.w:hover{filter:brightness(1.1)}
button.w:active{transform:translateY(1px)}
.w.w-off,.fam.user-off .w{background:transparent; color:var(--ink-3); text-decoration:line-through; box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--pc) 40%, transparent)}
.fam.user-off .w.anchor{background:transparent}
.w.used:not(.w-off){opacity:.45}
.mem{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:8px}
.mem b{color:var(--ink-2); font-weight:650}
.wb-key{display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--ink-3); opacity:.45; vertical-align:-1px; margin-right:4px}
.wb-offbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; font-size:13px; color:var(--ink-3)}
.wb-offbar b{color:var(--ink-2); font-weight:650}
.wb-empty{color:var(--ink-3); padding:20px; text-align:center; margin:0}

/* beats */
.beats{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:10px; margin:0; padding:0; list-style:none}
.beat{position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px; border-radius:14px; background:var(--deck-2); border:1px solid transparent; cursor:pointer; transition:border-color .15s, background-color .15s}
.beat:hover{background:#28212f}
.beat[aria-selected="true"]{border-color:var(--amber); background:#2a2128; box-shadow:0 0 0 1px var(--amber), 0 10px 30px -18px rgba(255,177,46,.6)}
.vinyl{width:48px; height:48px; border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle, var(--lab) 0 31%, #0d0b10 32% 34%, #1c1820 35% 40%, #0d0b10 41% 46%, #1c1820 47% 52%, #0d0b10 53% 60%, #19151d 61% 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.vinyl::after{content:""; position:absolute; inset:46%; border-radius:50%; background:#0d0b10}
.beat.playing .vinyl{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.beat-name{font-weight:750; font-stretch:105%; font-size:15px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.beat-meta{font:400 12px/1.3 var(--f-mono); color:var(--ink-3); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.beat-actions{display:flex; gap:4px}
.mini-btn{appearance:none; border:0; width:34px; height:34px; border-radius:10px; background:var(--rubber); display:grid; place-items:center; color:var(--ink-2)}
.mini-btn:hover{background:var(--rubber-2); color:var(--ink)}
.mini-btn svg{width:15px; height:15px}
.beat .confirm{position:absolute; inset:0; border-radius:14px; background:rgba(26,22,33,.96); display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px; flex-wrap:wrap}
.beat .confirm span{margin-right:auto; font-weight:650; font-size:14px}
.tempo{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center}
.tempo output{font:500 15px/1 var(--f-mono); min-width:5.5ch; text-align:right}
.drop{display:flex; align-items:center; gap:14px; padding:14px; border-radius:14px; border:1.5px dashed rgba(247,239,227,.18); cursor:pointer; transition:border-color .15s, background-color .15s}
.drop:hover,.drop.over{border-color:var(--amber); background:rgba(255,177,46,.06)}
.drop .plus{width:44px; height:44px; border-radius:12px; background:var(--rubber); display:grid; place-items:center; flex:none; color:var(--amber)}
.drop .plus svg{width:20px;height:20px}
.drop strong{display:block; font-weight:700}
.drop small{color:var(--ink-3); font-size:13px}
.status{font-size:13px; color:var(--ink-2); min-height:1em; margin:0}
.status.err{color:var(--danger)}
.spinner{width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.2); border-top-color:var(--amber); animation:spin .8s linear infinite; display:inline-block; vertical-align:-2px; margin-right:6px}

/* start bar */
.startbar{position:fixed; left:0; right:0; bottom:0; z-index:20; padding-inline:clamp(16px,3vw,44px); padding-block:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(18,15,23,.98) 55%, rgba(18,15,23,0)); }
.startbar-in{max-width:1360px; margin-inline:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--deck); border:1px solid var(--line); border-radius:18px; padding:12px 12px 12px 20px; box-shadow:0 20px 50px -20px #000}
.summary{min-width:0}
.summary b{font-weight:750; font-stretch:108%}
.summary span{display:block; color:var(--ink-3); font:400 12.5px/1.4 var(--f-mono)}
.go{appearance:none; border:0; font:400 clamp(17px,1.7vw,21px)/1 var(--f-display); letter-spacing:.03em; color:var(--amber-ink); background:var(--amber); padding:17px 26px 15px; border-radius:14px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), 0 0 40px -10px rgba(255,177,46,.8); display:inline-flex; align-items:center; gap:12px}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(2px); box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.go:disabled{filter:grayscale(.7) brightness(.7); cursor:wait}
.go svg{width:18px; height:18px}
@media (max-width:560px){.startbar-in{padding:12px}.go{width:100%; justify-content:center}}

/* drawer + modal */
